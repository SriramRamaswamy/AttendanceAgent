<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Log</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>
<body>
  <h1>Student Attendance Log</h1>
  <table>
    <tr>
      <th>Roll No</th>
      <th>Student Name</th>
      <th>Login Time</th>
      <th>Subject</th>
      <th>Sender</th>
    </tr>
    <!-- Rows will be appended here by n8n -->
  </table>
</body>
</html>
